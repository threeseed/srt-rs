[package]
authors = ["Russell Greene <russellgreene8@gmail.com>"]
description = "SRT implementation in Rust"
documentation = "https://docs.rs/srt-rs"
edition = "2021"
homepage = "https://github.com/russelltg/srt-rs"
license = "Apache-2.0"
name = "srt-compio"
publish = true
repository = "https://github.com/russelltg/srt-rs"
version = "0.4.4"

[dependencies]
bytes = "1"
rand = "0.8"
socket2 = "0.5"

[dependencies.ac-ffmpeg]
optional = true
version = "0.18"

[dependencies.futures]
default-features = false
features = ["std", "async-await"]
version = "0.3"

[dependencies.log]
default-features = false
version = "0.4"

[dependencies.srt-protocol]
version = "0.4.4"
path = "../srt-protocol"

[dependencies.compio]
features = ["macros", "time", "net", "runtime", "io-uring"]
default-features = false
version = "0.19.2"

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
anyhow = "1"
lazy_static = "1"
libc = "0.2"
libloading = "0.8"
rand = "0.8"
rand_distr = "0.4"
assert_matches = "1.0.0"

[dev-dependencies.pretty_env_logger]
default-features = false
version = "0.5"

[features]
default = []
log_disable = ["log/max_level_off"]
